services:
  atdp:
    build:
      context: .
      dockerfile: Dockerfile
    image: atdp-portal
    container_name: atdp
    ports:
      - "5000:5000"
    environment:
      - DB_PATH=/data/database.sqlite
      - PORT=5000
    volumes:
      - atdp-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  atdp-data:
