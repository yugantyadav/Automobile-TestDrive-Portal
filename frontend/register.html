<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Register — ATDP</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<div id="preloader"><div class="preloader-logo"><div style="display:flex;align-items:center;gap:16px"><div class="preloader-wings"><span class="wing"></span></div><div class="preloader-icon"><svg viewBox="0 0 24 24"><path d="M5 16L3 8h4l1.5 2H12l1.5-2H18l-2 8H5zm2.2-2h9.6l1-4h-2.3l-1.5 2H10.2L8.7 10H6.2l1 4z"/><circle cx="7.5" cy="17.5" r="1.2"/><circle cx="15.5" cy="17.5" r="1.2"/></svg></div><div class="preloader-wings"><span class="wing"></span></div></div><div class="preloader-atdp"><span>A</span><span>T</span><span>D</span><span>P</span></div><div class="preloader-subtitle">Navi Mumbai • Test Drive Portal</div></div></div>
<div id="toast-root"></div>
<header class="header"><div class="header-left"><button class="hamburger" id="hamburger"><span></span></button><a href="index.html" class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M5 16L3 8h4l1.5 2H12l1.5-2H18l-2 8H5zm2.2-2h9.6l1-4h-2.3l-1.5 2H10.2L8.7 10H6.2l1 4z"/><circle cx="7.5" cy="17.5" r="1.2"/><circle cx="15.5" cy="17.5" r="1.2"/></svg></span> ATDP</a></div><div class="header-right"><a href="login.html" class="btn btn-secondary">Login</a></div></header>
<nav class="mobile-nav" id="mobileNav"><a href="index.html">Home</a><a href="vehicles.html">Vehicles</a><div id="mobileAuth"></div></nav>

<main class="section">
  <div class="form-card">
    <div class="caption-uppercase" style="color:var(--color-brand-primary)">Join ATDP</div>
    <h1>Create Account</h1>
    <p class="sub">Register to book test drives across Navi Mumbai.</p>
    <form id="registerForm">
      <div class="field"><label>Full Name</label><input type="text" id="name" required placeholder="John Doe"/></div>
      <div class="field"><label>Email</label><input type="email" id="email" required placeholder="john@example.com"/></div>
      <div class="field"><label>Password</label><input type="password" id="password" required placeholder="Min 8 chars, uppercase, lowercase, number"/><small>Must include uppercase, lowercase and number</small></div>
      <div class="field"><label>Phone</label><input type="tel" id="phone" placeholder="+91 9876543210"/></div>
      <div class="field"><label>Address</label><input type="text" id="address" placeholder="Sector 17, Vashi, Navi Mumbai"/></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">Create Account</button>
    </form>
    <p class="caption" style="margin-top:16px;text-align:center">Already have an account? <a href="login.html" style="color:var(--color-brand-primary);text-decoration:underline">Login</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const payload={
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    phone: document.getElementById('phone').value.trim()||undefined,
    address: document.getElementById('address').value.trim()||undefined,
  };
  try{
    const {user, token}= await AuthAPI.register(payload);
    localStorage.setItem('atdp_token', token);
    localStorage.setItem('atdp_user', JSON.stringify(user));
    toast('Account created','success');
    setTimeout(()=> location.href='dashboard.html', 700);
  }catch(err){ toast(err.message,'error'); }
});
</script>
</body>
</html>
